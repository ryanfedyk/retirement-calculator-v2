# Firebase App Hosting configuration
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Scale to zero when idle to minimize cost; bump maxInstances if you get traffic.
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Gemini API key — powers ALL AI copy: AI Plan Analysis (/api/analyze),
  # seasons, perfect-day, AND the daily brief's editorial (lede + market outlook).
  # Stored in Cloud Secret Manager:
  #   firebase apphosting:secrets:set GEMINI_API_KEY
  # NOTE: rotating the key (a new secret VERSION) does NOT take effect until the
  # backend rolls out a new revision — secrets resolve at deploy time, so push to
  # main / create a rollout after changing it. A rejected key fails SILENTLY in the
  # digest (it falls back to deterministic copy); /api/analyze surfaces the error.
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  # ── Daily brief ("The Morning Glide") — weekday-morning email digest ──────────
  # NOTE: a referenced secret must exist in Secret Manager AND the App Hosting
  # service account must have "Secret Manager Secret Accessor" on it, or the
  # rollout fails with "error resolving secret version". The CLI grants this for
  # you (firebase apphosting:secrets:set / :grantaccess); the Secret Manager UI
  # does not — grant it there manually under the secret's Permissions tab.
  # Sender address for the Gmail-app-password SMTP send (not secret; just an email).
  - variable: GMAIL_USER
    value: "ryanfedyk@gmail.com"
    availability:
      - RUNTIME
  # The 16-char Gmail app password. Create it, then store it:
  #   firebase apphosting:secrets:set GMAIL_APP_PASSWORD
  - variable: GMAIL_APP_PASSWORD
    secret: GMAIL_APP_PASSWORD
    availability:
      - RUNTIME
  # Shared secret the scheduled GitHub Action presents to /api/digest/send. Set the
  # SAME value here and as a GitHub Actions repo secret named CRON_SECRET:
  #   firebase apphosting:secrets:set CRON_SECRET   (value: openssl rand -hex 32)
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME

  # Firebase web-app config. Public values — inlined into the client bundle at
  # build time, so they must be available at BUILD. Set them with:
  #   firebase apphosting:secrets:set <NAME>  (or plain values in the console)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyCKsuTwORWPDQkpYTKCJzXpooY7tjMNYxM"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "retirement-calc-v2.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "retirement-calc-v2"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "retirement-calc-v2.firebasestorage.app"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1085666695529"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:1085666695529:web:cf9444a621cb70a47285f8"
    availability: [BUILD, RUNTIME]
