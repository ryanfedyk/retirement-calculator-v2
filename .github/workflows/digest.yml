name: Daily brief

# Fires the weekday-morning "Morning Glide" email. The schedule runs hourly across
# a UTC window that covers ~7am in US zones; the SEND ROUTE decides, per user and in
# their own timezone, whether it's their morning and the brief hasn't gone out today
# (so a delayed or extra run never double-sends). GitHub cron timing is best-effort,
# which is exactly why the route is the source of truth, not the clock here.
on:
  schedule:
    # Twice an hour, Mon–Fri (UTC), at :23 and :53. A send goes out only once per
    # user per day, at or after THEIR chosen local hour, so firing all day means
    # the first eligible run lands near their morning in ANY timezone. GitHub cron
    # is BEST-EFFORT — it silently drops scheduled runs under load, most often at
    # the top of the hour (minute 0). So we (a) fire twice an hour to survive a
    # dropped run, and (b) avoid minute 0, the most-throttled slot. The route, not
    # the clock here, is the source of truth and dedupes to one send per day — so
    # an extra/duplicate run is harmless. For a GUARANTEED send, back this with
    # Google Cloud Scheduler hitting /api/digest/send (GitHub cron can't promise it).
    - cron: "23,53 * * * 1-5"
  workflow_dispatch: # manual "Run workflow" button for testing
    inputs:
      force:
        description: "Send now, ignoring the weekday/hour schedule (for testing)"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest send
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://retirement-calc-v2--retirement-calc-v2.us-east4.hosted.app
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET repo secret is not set — skipping"; exit 0; fi
          URL="$APP_URL/api/digest/send"
          # `force` only exists on manual runs; when ticked, bypass the schedule.
          if [ "$FORCE" = "true" ]; then URL="$URL?force=1"; echo "Force send ON"; fi
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json")
          echo "HTTP $code"; cat /tmp/resp.json || true
          # A non-2xx is a real failure worth surfacing in the Actions log.
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
